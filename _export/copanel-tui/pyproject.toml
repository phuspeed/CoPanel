[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "copanel-tui"
version = "0.1.0"
description = "Terminal control panel for CoPanel — JWT API client (Textual)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "phuspeed" }]
keywords = ["copanel", "tui", "textual", "vps"]
dependencies = [
  "httpx>=0.27.0",
  "textual>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "pytest>=8.0.0"]

[project.scripts]
copanel-tui = "copanel_tui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copanel_tui"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["src/copanel_tui", "README.md", "docs", "pyproject.toml"]
