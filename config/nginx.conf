# Nginx configuration reference.
# scripts/install.sh writes the live site (plain HTTP on 8686). This file is
# not copied automatically. Package Manager rewrites the phpMyAdmin block
# (between the COPANEL PHPMYADMIN markers) after php-fpm is installed.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# BEGIN COPANEL PHPMYADMIN MAP
# Direct http://HOST:8686 clients send no X-Forwarded-Proto, so phpMyAdmin
# stays on the origin scheme. Cloudflare Tunnel (and other reverse proxies)
# set X-Forwarded-Proto or CF-Visitor to https. The public port is then 443
# unless the proxy sends a numeric X-Forwarded-Port.
map "$http_x_forwarded_proto#$http_cf_visitor" $copanel_pma_scheme {
    default $scheme;
    "~*^https" https;
    "~*^http#" http;
    "~*scheme.:.https" https;
}
map $copanel_pma_scheme $copanel_pma_https {
    https   on;
    default "";
}
map $http_x_forwarded_port $copanel_pma_xf_port {
    default "";
    "~^[0-9]{1,5}$" $http_x_forwarded_port;
}
map $copanel_pma_scheme $copanel_pma_scheme_port {
    https   443;
    default $server_port;
}
map $copanel_pma_xf_port $copanel_pma_server_port {
    ""      $copanel_pma_scheme_port;
    default $copanel_pma_xf_port;
}
# END COPANEL PHPMYADMIN MAP

upstream copanel_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}


# Main server block.
server {
    listen 8686;
    listen [::]:8686;
    
    server_name localhost;
    
    # Increase body size for file uploads
    client_max_body_size 100M;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Cache settings for static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # AppStore extension modules (pre-built ESM — no full panel rebuild on install).
    # Must appear before ``location /`` so SPA try_files never returns index.html for JSON.
    location /extensions/ {
        auth_basic off;
        alias /opt/copanel/frontend/dist/extensions/;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        types {
            application/javascript js mjs;
            text/css css;
            application/json json;
        }
    }

    # Frontend (React static files) — try_files handles SPA fallback; do not use server-wide error_page 404 → index.html (breaks /api 404 JSON).
    location / {
        root /opt/copanel/frontend/dist;
        try_files $uri $uri/ /index.html;
        
        # Don't cache HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # phpMyAdmin direct configuration
    # BEGIN COPANEL PHPMYADMIN
    location = /phpmyadmin {
        absolute_redirect off;
        return 301 /phpmyadmin/;
    }

    location ^~ /phpmyadmin/ {
        alias /usr/share/phpmyadmin/;
        index index.php;
        absolute_redirect off;

        location ~ /\. {
            deny all;
        }

        location ~ ^/phpmyadmin/(libraries|templates|setup|vendor|locale)/ {
            deny all;
        }

        location = /phpmyadmin/config.inc.php {
            deny all;
        }

        location ~ ^/phpmyadmin/(?<pma_script>.+\.php)$ {
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_hide_header X-Powered-By;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_busy_buffers_size 64k;
            fastcgi_read_timeout 300s;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT /usr/share/phpmyadmin;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $copanel_pma_scheme;
            fastcgi_param HTTPS $copanel_pma_https if_not_empty;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $copanel_pma_server_port;
            fastcgi_param SERVER_NAME $host;
            fastcgi_param REDIRECT_STATUS 200;
            fastcgi_param SCRIPT_FILENAME /usr/share/phpmyadmin/$pma_script;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTP_SCHEME $copanel_pma_scheme;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        }
    }
    # END COPANEL PHPMYADMIN

    
    # API endpoints
    location /api/platform/events {
        proxy_pass http://copanel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Accel-Buffering "no" always;
    }

    location /api/ {
        auth_basic off;
        proxy_pass http://copanel_backend;
        proxy_intercept_errors off;

        # HTTP version
        proxy_http_version 1.1;
        
        # WebSocket support (terminal, etc.)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Proxy headers
        proxy_set_header Host $host;
        # $remote_addr is the TCP peer. Behind a CDN, configure nginx real_ip
        # so this is the client address rather than a shared edge hop.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts (long read for WebSocket sessions)
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Health check endpoint. Loopback probes skip the security entrance.
    location /health {
        proxy_pass http://copanel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    error_page 500 502 503 504 /50x.html;
}

