<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Cpath d='M41 20a16 16 0 1 0 0 24' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script>
      (function () {
        try {
          if (localStorage.getItem('copanel_mobile_desktop_site') === '1') {
            var meta = document.querySelector('meta[name="viewport"]');
            if (meta) {
              meta.setAttribute(
                'content',
                'width=1280, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes'
              );
            }
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var map = { sm: '100%', md: '112.5%', lg: '125%', xl: '137.5%' };
          var v = localStorage.getItem('copanel_font_size');
          var id = map[v] ? v : 'md';
          document.documentElement.style.fontSize = map[id];
          document.documentElement.setAttribute('data-cp-font', id);
        } catch (e) {}
      })();
    </script>
    <title>CoPanel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
